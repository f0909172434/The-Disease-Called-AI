<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Him — design sheet</title>
  <style>html, body { margin: 0; background: #DADBDE; }</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    // Design sheet for the human lead ("him"). Captured by tools/char_capture.mjs:
    //   cd visuals && node tools/char_capture.mjs --page char_him_preview.html --out ../output/sheets/char_him_design.jpg --width 2400 --height 1500
    // Solo mode for iteration: ?solo=bust&expr=tired&outfit=home&palette=drained&scale=1.2&seed=0&blink=0&w=1400&h=1400
    import { CHARACTER, renderToCanvas } from '../src/kit/heroine/him/index.js';

    const q = new URLSearchParams(location.search);
    const cv = document.getElementById('c');
    const c = cv.getContext('2d');
    const BG = '#DADBDE', INK = '#2A2D35', SUB = '#6B6F7A';
    const timings = {};

    function view(name, params, scale) {
      const r = renderToCanvas(document, name, params, scale);
      (timings[name] ||= []).push(r.ms);
      return r.canvas;
    }
    function label(text, x, y, size = 22, color = INK, weight = 600) {
      c.fillStyle = color;
      c.font = `${weight} ${size}px "Helvetica Neue", Arial, sans-serif`;
      c.fillText(text, x, y);
    }
    function panel(x, y, w, h, title, sub) {
      c.fillStyle = '#E4E5E8';
      c.fillRect(x, y, w, h);
      c.strokeStyle = '#C3C5CB';
      c.lineWidth = 1;
      c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      if (title) label(title, x + 14, y + 28, 19);
      if (sub) label(sub, x + 14, y + 50, 14, SUB, 400);
    }
    // place a rendered view canvas so that its reference rect [rx0,ry0,rx1,ry1] fits the box
    function place(img, scale, crop, box, align = 'center') {
      const [rx0, ry0, rx1, ry1] = crop;
      const sx = rx0 * scale, sy = ry0 * scale, sw = (rx1 - rx0) * scale, sh = (ry1 - ry0) * scale;
      const k = Math.min(box.w / sw, box.h / sh);
      const dw = sw * k, dh = sh * k;
      const dx = box.x + (box.w - dw) / 2, dy = align === 'bottom' ? box.y + box.h - dh : box.y + (box.h - dh) / 2;
      c.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    }
    const params = (o = {}) => ({ boilSeed: Number(q.get('seed') || 0), ...o });

    if (q.get('solo')) {
      const name = q.get('solo');
      const W = Number(q.get('w') || 1400), H = Number(q.get('h') || 1400);
      cv.width = W; cv.height = H;
      c.fillStyle = BG; c.fillRect(0, 0, W, H);
      const v = CHARACTER.views[name];
      const scale = Number(q.get('scale') || Math.min(W / v.size[0], H / v.size[1]));
      const p = params({
        expr: { [q.get('expr') || 'focused']: 1 }, outfit: q.get('outfit') || 'launch', palette: q.get('palette') || 'human',
        blink: Number(q.get('blink') || 0), mouth: { open: Number(q.get('open') || 0), vowel: q.get('vowel') || 'A' },
        gaze: { x: Number(q.get('gx') || 0), y: Number(q.get('gy') || 0) }, hairSway: Number(q.get('sway') || 0),
        t: Number(q.get('t') || 0), headTilt: Number(q.get('tilt') || 0), glow: Number(q.get('glow') || 0),
      });
      const img = view(name, p, scale);
      const cx = q.get('cx') ? Number(q.get('cx')) * scale : 0, cy = q.get('cy') ? Number(q.get('cy')) * scale : 0;
      c.drawImage(img, (W - img.width) / 2 - cx, (H - img.height) / 2 - cy);
    } else {
      const W = 2400, H = 1500;
      cv.width = W; cv.height = H;
      c.fillStyle = BG; c.fillRect(0, 0, W, H);
      label('"HIM" — human lead · character design sheet (draft for approval)', 28, 40, 26);
      label('original character · Canvas 2D procedural · warm hand-drawn world: ink boil + watercolour wash', 30, 64, 15, SUB, 400);

      // row 1: full A | bust B | profile
      const r1y = 80, r1h = 800;
      panel(20, r1y, 560, r1h, 'FULL · outfit A "launch"', '3/4 standing, ~7.5 heads, mid-explanation');
      if (CHARACTER.views.full.layers.length) {
        const s = 0.5;
        const img = view('full', params({ outfit: 'launch', expr: { focused: 0.6, smile: 0.4 } }), s);
        place(img, s, [0, 0, ...CHARACTER.views.full.size], { x: 30, y: r1y + 56, w: 540, h: r1h - 66 }, 'bottom');
      }
      panel(590, r1y, 560, r1h, 'BUST · outfit B "home"', 'blazer off, rumpled shirt (later scenes)');
      {
        const s = 0.75;
        const img = view('bust', params({ outfit: 'home', expr: { tired: 1 } }), s);
        place(img, s, [40, 100, 960, 1000], { x: 600, y: r1y + 60, w: 540, h: r1h - 70 }, 'bottom');
      }
      panel(1160, r1y, 1220, r1h, 'PROFILE · desk shot', 'right-facing, lit by the monitor (main storyboard shot)');
      if (CHARACTER.views.profile.layers.length) {
        const s = 0.8;
        const img = view('profile', params({ outfit: 'launch', expr: { focused: 1 }, glow: 0.8 }), s);
        place(img, s, [0, 0, ...CHARACTER.views.profile.size], { x: 1170, y: r1y + 60, w: 1200, h: r1h - 70 });
      }

      // row 2: expressions
      const r2y = 890, r2h = 380;
      const exprs = [['focused', 'focused'], ['smile', 'smile'], ['tired', 'tired'], ['anxious', 'anxious'], ['panic', 'panic'], ['blank', 'blank · screen glow']];
      exprs.forEach(([e, t], i) => {
        const x = 20 + i * 396;
        panel(x, r2y, 386, r2h, t.toUpperCase(), '');
        const s = 0.5;
        const img = view('bust', params({ outfit: 'launch', expr: { [e]: 1 }, mouth: e === 'smile' ? { open: 0 } : undefined }), s);
        place(img, s, [110, 110, 890, 860], { x: x + 6, y: r2y + 36, w: 374, h: r2h - 40 });
      });

      // row 3: palettes
      const r3y = 1280, r3h = 200;
      const pals = [['human', 'HUMAN (default)'], ['drained', 'DRAINED (verse 2)'], ['swapped', 'SWAPPED (final chorus)']];
      pals.forEach(([pn, t], i) => {
        const x = 20 + i * 792;
        panel(x, r3y, 782, r3h, t, '');
        const s = 0.32;
        const img = view('bust', params({ palette: pn, expr: { [pn === 'drained' ? 'tired' : pn === 'swapped' ? 'blank' : 'focused']: 1 } }), s);
        place(img, s, [80, 100, 920, 900], { x: x + 10, y: r3y + 34, w: 260, h: r3h - 40 });
        const pal = CHARACTER.palettes[pn];
        const keys = ['skin', 'skinShade', 'hair', 'hairSheen', 'iris2', 'blazer', 'blazerShade', 'shirt', 'shirtShade', 'frame', 'band', 'skinLine'];
        keys.forEach((k, j) => {
          const sx = x + 290 + (j % 6) * 80, sy = r3y + 46 + Math.floor(j / 6) * 74;
          c.fillStyle = pal[k]; c.fillRect(sx, sy, 66, 40);
          c.strokeStyle = '#9EA2AB'; c.strokeRect(sx + 0.5, sy + 0.5, 65, 39);
          label(k, sx, sy + 56, 11, SUB, 400);
        });
      });
    }
    const avg = (a) => (a.reduce((x, y) => x + y, 0) / a.length).toFixed(1);
    window.__timings = Object.fromEntries(Object.entries(timings).map(([k, v]) => [k, avg(v)]));
    console.log('ms per view', JSON.stringify(window.__timings));
    window.__done = true;
  </script>
</body>
</html>
